<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1618">
<meta name="description" content="Rodízio de organistas da Congregação Cristã no Brasil · Jd. Aviação">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>Rodízio de Organistas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0F1618; --surface:#172124; --surface-2:#1F2C30; --ink:#E4ECEA; --muted:#98A8AB;
  --line:#2C3B3F; --accent:#7DB5C5; --accent-ink:#0F1618; --brass:#D6B26A; --brass-soft:#2B2618;
  --warn:#F08E6B; --warn-soft:#3A2119; --ok:#7CC593;
  --radius:12px;
  --display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px;padding-bottom:96px}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto}
header.top{padding-block:18px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.02em;margin:0;line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:0;font-weight:500}
.sc{font-family:var(--display);letter-spacing:.06em;font-size:13px;color:var(--muted)}
h2{font-family:var(--display);font-size:19px;letter-spacing:.03em;margin:26px 0 10px;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.hero{border-color:var(--accent);border-width:2px;padding:18px}
.hero .when{font-size:24px;font-weight:700;line-height:1.2;margin:4px 0 2px;text-wrap:balance}
.hero .what{color:var(--muted);font-weight:500}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--brass-soft);color:var(--brass)}
.roles{display:grid;gap:10px;margin-top:14px}
.role{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:10px;border-top:1px solid var(--line)}
.role .lbl{font-family:var(--display);letter-spacing:.05em;font-size:14px;color:var(--muted)}
.role .nm{font-size:21px;font-weight:700;text-align:right}
.role.main .nm{color:var(--accent)}
.sub{margin-top:14px;padding-top:12px;border-top:2px solid var(--surface-2)}
.sub .sc{display:block;margin-bottom:2px}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:58px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.row.past{opacity:.55}
.row.today{border-color:var(--brass);border-width:2px}
.row.sun{background:var(--surface)}
.date{text-align:center;line-height:1.05}
.date b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.date span{font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--muted)}
.row.sun .date span{color:var(--warn)}
.svc + .svc{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.svc-h{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.trio.duo{grid-template-columns:repeat(2,minmax(0,1fr))}
.cell .l{font-family:var(--display);font-size:11.5px;letter-spacing:.06em;color:var(--muted);display:block}
.cell .n{font-weight:700;font-size:15.5px;overflow-wrap:normal;word-break:keep-all;letter-spacing:-.01em;display:block;min-width:0}
.cell.me .n{color:var(--brass);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cell select{width:100%;padding:6px 2px;font-size:14px!important;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:15px}
.cell.bad select{border-color:var(--warn);background:var(--warn-soft)}
.conf{display:block;font-size:12px;color:var(--warn);font-weight:700}
.ensaio{background:var(--brass-soft);border-color:var(--brass)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 12px}
.monthnav .t{font-family:var(--display);font-size:21px;letter-spacing:.03em;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.empty{color:var(--muted);text-align:center;padding:26px 12px}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted)}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:14px;font-weight:700;color:var(--muted)}
.field select,.field input{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
.org{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.org:first-child{border-top:0}
.org .num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.org .nmI{font-weight:700;border:1px solid transparent;background:transparent;padding:2px 4px;border-radius:6px;width:100%}
.org .nmI:focus{border-color:var(--line);background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:transparent;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.brass[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--accent-ink)}
.mini{display:flex;flex-direction:column;gap:4px}
.mini button{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.confirm{margin-top:10px;padding:12px;border-radius:10px;background:var(--warn-soft);color:var(--ink)}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:10}
.tabbar .in{display:flex;gap:4px;max-width:560px;width:100%}
.tab{flex:1;border:0;background:transparent;padding:6px 2px;border-radius:10px;display:grid;justify-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--surface-2)}
.savebar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding-inline:16px;z-index:11}
.savebar .in{max-width:560px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px}
.savebar .btn{background:var(--brass);border-color:var(--brass);color:#1B1305}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.fol{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fol:first-child{border-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{position:relative}
.editbtn{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--accent);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;cursor:pointer}
.row.editing{border-color:var(--accent);border-width:2px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.rowact{margin:12px 0 0}
.cell input.dt{width:100%;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:15px}
.btn.ghost{background:transparent;color:var(--bg);border-color:transparent}
.wk{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding-inline:2px}
.wk span{font-family:var(--display);font-size:14px;letter-spacing:.05em;color:var(--muted)}
.wk:first-child{margin-top:0}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.btn.sm{padding:6px 10px;font-size:13.5px}
.cpy{margin-top:8px;width:36px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--accent);display:inline-grid;place-items:center;cursor:pointer}
.cpy svg{width:17px;height:17px}
.busca{display:grid;gap:4px;margin:0 0 12px}
.busca label{font-size:14px;font-weight:700;color:var(--muted)}
.busca-in{display:flex;gap:8px;align-items:center}
.busca input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.aviso{background:var(--brass-soft);border-color:var(--brass);margin-bottom:12px}
.row.alvo{outline:3px solid var(--brass);outline-offset:2px}
.og-list{padding:4px 14px}
.og{border-top:1px solid var(--line)}
.og:first-child{border-top:0}
.og-h{width:100%;display:grid;grid-template-columns:22px 1fr auto 18px;align-items:center;gap:10px;padding:11px 0;background:none;border:0;text-align:left;cursor:pointer}
.og-h .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;text-align:right}
.og-n{font-weight:700}
.og-n em{font-style:normal;font-size:12px;color:var(--warn);font-weight:700;margin-left:4px}
.og-r{font-size:13px;color:var(--muted);text-align:right}
.og-h .lnk{padding:0}
.og-h.ac{grid-template-columns:22px 1fr auto auto;cursor:default}
.chev{color:var(--accent);font-weight:700;font-size:18px;text-align:center}
.og.off .og-n{color:var(--muted)}
.og-b{padding:0 0 12px 32px}
.og-a{display:flex;gap:14px;margin-top:10px}
.lnk{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer}
.lnk.warn{color:var(--warn);margin-left:auto}
.lnk:disabled{opacity:.35;cursor:default}
@media (max-width:380px){.og-r{display:none}}
.row{scroll-margin-top:calc(52px + env(safe-area-inset-top,0px))}
.row.prox::before{content:"Próximo";position:absolute;top:-9px;left:12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:999px}
.row.prox{border-color:var(--accent);border-width:2px}
.savebar .in{background:#E4ECEA;color:#0F1618}
.btn.ghost{color:#0F1618}
.toast{background:#E4ECEA;color:#0F1618}
.sep{height:1px;background:var(--line);margin:14px 0}
.lbl-s{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
.avisos{margin:6px 0 0;padding-left:18px;font-size:14px}
.field input[type=file]{padding:8px;font-size:14px}
.anteriores{justify-self:start;color:var(--accent)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
@media (max-width:380px){.cell .n{font-size:15px}.row{grid-template-columns:48px 1fr;gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
header.top{display:block}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub-brand{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.quem{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted);display:grid;text-align:right;line-height:1.15;flex-shrink:0}
.quem span{color:var(--ink);font-size:14px}
.acesso{padding-bottom:24px}
.grp{font-family:var(--display);font-size:15px;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
.nomes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nomebtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px 12px;font-size:18px;font-weight:700;text-align:left;cursor:pointer}
.nomebtn:active{background:var(--surface-2)}
</style>

(function(){
"use strict";
var EDITORA = (window.RODIZIO_EDITORA||"janaina");
var SRC = JSON.parse(document.getElementById("dados").textContent);
function normalizarDados(d){if(!d.ministerio)d.ministerio=[{id:"levi",nome:"Levi"},{id:"thiago",nome:"Thiago"},{id:"josea",nome:"José A."}];return d}
normalizarDados(SRC);
var S = JSON.parse(JSON.stringify(SRC));
var TIPOS = {

};

var SEM = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
var SEM3 = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
var DIASCHIP = [["qua","Qua"],["sab","Sáb"],["dom","Dom noite"],["rjm","RJM"]];

try{ ui.eu = localStorage.getItem("rodizio-eu"); }catch(e){}
ui.acessos=null; ui.pedido=null;

function pad(n){return (n<10?"0":"")+n}
function ymd(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}
function parse(d){var p=d.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function ymOf(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)}
function addMonth(ym,n){var p=ym.split("-");var dt=new Date(+p[0],+p[1]-1+n,1);return ymOf(dt)}
function mesNome(ym){var p=ym.split("-");return MESES[+p[1]-1]+" "+p[0]}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function slug(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"")||"org"}
function ausente(id,d){return S.folgas.some(function(f){return f.org===id && f.de<=d && d<=f.ate})}

/* ---------- eventos ---------- */
function eventos(){
  var ev=[];
  Object.keys(S.meses).forEach(function(ym){
    var M=S.meses[ym];
    (M.servicos||[]).forEach(function(s){var t=TIPOS[s.t];ev.push({k:"svc",s:s,d:s.d,h:t.hora})});
    if(M.ensaio&&M.ensaio.d) ev.push({k:"ens",e:M.ensaio,d:M.ensaio.d,h:M.ensaio.hora||"19:30"});
  });
  ev.sort(function(a,b){return (a.d+a.h)<(b.d+b.h)?-1:(a.d+a.h)>(b.d+b.h)?1:0});
  return ev;
}
function inicio(e){var p=e.h.split(":");var dt=parse(e.d);dt.setHours(+p[0],+p[1]);return dt}
function futuros(){var now=Date.now();return eventos().filter(function(e){return inicio(e).getTime()+100*60000>now})}

/* ---------- geração automática ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function quartaSegunda(ym){var p=ym.split("-");var dt=new Date(+p[0],+p[1]-1,1);while(dt.getDay()!==1)dt.setDate(dt.getDate()+1);dt.setDate(dt.getDate()+21);return ymd(dt)}
function proximaAfinacao(ym){
  var lista=S.organistas.filter(function(o){return o.ativa&&o.afina});
  if(!lista.length) return "";
  var prev=null, cur=addMonth(ym,-1);
  for(var i=0;i<24&&!prev;i++){var M=S.meses[cur];if(M&&M.ensaio&&M.ensaio.afina)prev=M.ensaio.afina;cur=addMonth(cur,-1)}
  var idx=-1; if(prev){for(var j=0;j<lista.length;j++) if(lista[j].id===prev) idx=j}
  if(idx<0){ /* sem histórico: setembro/2026 = primeira da lista */
    var p=ym.split("-"); var n=(+p[0]-2026)*12+(+p[1]-9); return lista[((n%lista.length)+lista.length)%lista.length].id;
  }
  return lista[(idx+1)%lista.length].id;
}
function gerar(ym,variante){
  var p=ym.split("-"), y=+p[0], m=+p[1];
  var dim=new Date(y,m,0).getDate();
  var slots=[];
  for(var d=1;d<=dim;d++){
    var dt=new Date(y,m-1,d), wd=dt.getDay(), ds=ymd(dt);
    if(wd===3) slots.push({d:ds,t:"qua"});
    if(wd===6) slots.push({d:ds,t:"sab"});
    if(wd===0){slots.push({d:ds,t:"rjm"});slots.push({d:ds,t:"dom"})}
  }
  var cnt={oficio:{},rjm:{}}, rc={}, last={};
  var prevM=S.meses[addMonth(ym,-1)];
  Object.keys(S.meses).forEach(function(k){ if(k>=ym) return;
    (S.meses[k].servicos||[]).forEach(function(s){TIPOS[s.t].roles.forEach(function(r){var id=s[r];if(id&&(!last[id]||last[id]<s.d))last[id]=s.d})});
  });
  if(prevM)(prevM.servicos||[]).forEach(function(s){var c=s.t==="rjm"?"rjm":"oficio";TIPOS[s.t].roles.forEach(function(r){var id=s[r];if(id){cnt[c][id]=(cnt[c][id]||0)+0.4}})});
  var rand=rng(y*100+m+(variante||0)*7919), usadosDia={}, out=[];
  slots.forEach(function(sl){
    var t=TIPOS[sl.t], cat=sl.t==="rjm"?"rjm":"oficio", svc={d:sl.d,t:sl.t}, noSlot={};
    usadosDia[sl.d]=usadosDia[sl.d]||{};
    ["culto","meia","reserva"].forEach(function(r){
      if(t.roles.indexOf(r)<0) return;
      function cands(relax){return S.organistas.filter(function(o){
        return o.ativa && o.dias.indexOf(sl.t)>=0 && !ausente(o.id,sl.d) && !noSlot[o.id] && (relax||!S.regraMesmoDia||!usadosDia[sl.d][o.id]);
      })}
      var c=cands(false); if(!c.length) c=cands(true);
      var best=null,bs=1e9;
      c.forEach(function(o){
        var sc=10*(cnt[cat][o.id]||0)+6*((cnt.oficio[o.id]||0)+(cnt.rjm[o.id]||0))+3*((rc[r+cat]||{})[o.id]||0)+rand()*0.8;
        if(last[o.id]){var gap=(parse(sl.d)-parse(last[o.id]))/864e5;if(gap<3)sc+=9;else if(gap<6)sc+=3}
        if(sc<bs){bs=sc;best=o}
      });
      if(best){
        svc[r]=best.id; noSlot[best.id]=1; usadosDia[sl.d][best.id]=1;
        cnt[cat][best.id]=(cnt[cat][best.id]||0)+1;
        rc[r+cat]=rc[r+cat]||{}; rc[r+cat][best.id]=(rc[r+cat][best.id]||0)+1;
        last[best.id]=sl.d;
      } else svc[r]="";
    });
    out.push(svc);
  });
  return {servicos:out,ensaio:{d:quartaSegunda(ym),hora:"19:30",afina:proximaAfinacao(ym)}};
}

/* ---------- importar Excel ---------- */
function carregarXLSX(){return window.XLSX?Promise.resolve():new Promise(function(res,rej){var sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
function normT(x){return String(x==null?"":x).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function acharOrganista(txt,avisos){
  var n=normT(txt); if(!n) return "";
  var L=S.organistas.map(function(o){return {id:o.id,n:normT(o.nome)}});
  for(var i=0;i<L.length;i++) if(L[i].n===n) return L[i].id;
  var best=null; L.forEach(function(o){if((n.indexOf(o.n+" ")===0||(/ [A-Z]$/.test(o.n)&&n.indexOf(o.n)===0))&&(!best||o.n.length>best.n.length))best=o});
  if(best) return best.id;
  var bd=9,bo=null; L.forEach(function(o){var dd=lev(n,o.n);if(dd<bd){bd=dd;bo=o}});
  if(bo&&bd<=2&&n.length>=4){avisos.push('"'+String(txt).trim()+'" entendido como '+nome(bo.id)+".");return bo.id}
  var t=String(txt).trim().toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase()});
  avisos.push('"'+String(txt).trim()+'" não está na lista de organistas.');
  return t;
}
function detectarMes(rows){
  for(var r=0;r<Math.min(rows.length,8);r++){var t=normT(rows[r].join(" "));
    for(var m=0;m<12;m++){var mn=normT(MESES[m]);var re=new RegExp("\\b"+mn+"\\b\\s*(20\\d\\d)?");var mm=t.match(re);if(mm){var y=mm[1]||(t.match(/\b20\d\d\b/)||[])[0];if(y)return y+"-"+pad(m+1)}}}
  return null;
}
function interpretarPlanilha(rows,ymPadrao){
  var avisos=[], ym=detectarMes(rows)||ymPadrao, p=ym.split("-"), y=+p[0], m=+p[1], dim=new Date(y,m,0).getDate();
  var hdr=-1,col={};
  for(var r=0;r<rows.length&&hdr<0;r++){
    var c={};rows[r].forEach(function(v,j){var k=normT(v).replace(/ /g,"");
      if(k==="DIA"||k==="DATA")c.dia=j;
      else if(k.indexOf("RJM")>=0){if(k.indexOf("HORA")>=0||k.indexOf("12")===0||k.indexOf("MEIA")>=0)c.rjmMeia=j;else c.rjmCulto=j}
      else if(k.indexOf("HORA")>=0||k.indexOf("MEIA")>=0)c.meia=j;
      else if(k==="CULTO")c.culto=j;
      else if(k.indexOf("RESERVA")>=0)c.reserva=j;});
    if(c.dia!=null&&c.culto!=null){hdr=r;col=c}
  }
  if(hdr<0) throw new Error("Não encontrei o cabeçalho (DIA, 1/2 HORA, CULTO, RESERVA).");
  var out=[],ensaio=null,emEnsaio=false;
  function cel(row,j){return j==null?"":String(row[j]==null?"":row[j]).trim()}
  for(var r2=hdr+1;r2<rows.length;r2++){
    var row=rows[r2], txt=normT(row.join(" "));
    if(!txt) continue;
    var dm=cel(row,col.dia).match(/\d{1,2}/)||(emEnsaio?String(row[0]||"").match(/\d{1,2}/):null);
    if(txt.indexOf("ENSAIO")>=0&&!dm){emEnsaio=true;continue}
    if(!dm) continue;
    var dia=+dm[0]; if(dia<1||dia>dim){avisos.push("Linha com dia "+dia+" ignorada (não existe em "+mesNome(ym)+").");continue}
    var d=ym+"-"+pad(dia), dow=parse(d).getDay();
    if(emEnsaio){
      var hr="19:30",af="";
      row.forEach(function(v,j){var s2=String(v==null?"":v).trim();var hm=s2.match(/^(\d{1,2})\s*[:hH]\s*(\d{2})$/);if(hm){hr=pad(+hm[1])+":"+hm[2];return}
        if(j===col.dia||!s2||/^\d+$/.test(s2))return; var ns=normT(s2); if(ns==="ORGANISTA"||ns.indexOf("AFINA")===0)return; af=s2});
      ensaio={d:d,hora:hr,afina:af?acharOrganista(af,avisos):""};emEnsaio=false;continue;
    }
    var t=dow===3?"qua":dow===6?"sab":dow===0?"dom":null;
    if(!t){avisos.push("Dia "+pad(dia)+" ("+SEM[dow].toLowerCase()+") ignorado: não é dia de culto.");continue}
    if(dow===0&&(cel(row,col.rjmMeia)||cel(row,col.rjmCulto))) out.push({d:d,t:"rjm",meia:acharOrganista(cel(row,col.rjmMeia),avisos),culto:acharOrganista(cel(row,col.rjmCulto),avisos)});
    out.push({d:d,t:t,meia:acharOrganista(cel(row,col.meia),avisos),culto:acharOrganista(cel(row,col.culto),avisos),reserva:acharOrganista(cel(row,col.reserva),avisos)});
  }
  if(!out.length) throw new Error("Não encontrei nenhum culto na planilha.");
  if(!ensaio){ensaio={d:quartaSegunda(ym),hora:"19:30",afina:proximaAfinacao(ym)};avisos.push("A planilha não tem ensaio: usei a 4ª segunda-feira ("+fmtCurta(ensaio.d)+") com afinação de "+nome(ensaio.afina)+".")}
  var vistos={};avisos=avisos.filter(function(a){if(vistos[a])return false;vistos[a]=1;return true});
  return {ym:ym,data:{servicos:out,ensaio:ensaio},avisos:avisos};
}
function lerPlanilha(file){
  ui.lendo=true;render();
  carregarXLSX().then(function(){return file.arrayBuffer()}).then(function(buf){
    var wb=XLSX.read(buf,{type:"array"}); var ws=wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false,blankrows:false});
    var r=interpretarPlanilha(rows,ui.gerMes||addMonth(ymOf(new Date()),1));
    ui.lendo=false;ui.gerMes=r.ym;ui.rasc={ym:r.ym,v:0,data:r.data,origem:"excel",avisos:r.avisos};render();irPara("gerar-h");
  }).catch(function(e){ui.lendo=false;render();toast(e&&e.message&&e.message.indexOf("Não")===0?e.message:"Não consegui ler esse arquivo. Envie um .xlsx no modelo da escala.")});
}

/* ---------- conflitos ---------- */
function conflitos(ym){return conflitosDe(S.meses[ym])}
function conflitosDe(M){
  var res={}; if(!M) return res;
  var porDia={};
  M.servicos.forEach(function(s,i){TIPOS[s.t].roles.forEach(function(r){var id=s[r];if(!id)return;
    (porDia[s.d]=porDia[s.d]||{});(porDia[s.d][id]=porDia[s.d][id]||[]).push(i+":"+r);
    if(ausente(id,s.d)) res[i+":"+r]="de folga";
    var o=orgById(id); if(o&&o.dias.indexOf(s.t)<0&&!res[i+":"+r]) res[i+":"+r]="fora dos dias dela";
  })});
  if(M.ensaio&&M.ensaio.afina&&ausente(M.ensaio.afina,M.ensaio.d)) res["ens"]="de folga";
  if(S.regraMesmoDia) Object.keys(porDia).forEach(function(d){Object.keys(porDia[d]).forEach(function(id){var a=porDia[d][id];if(a.length>1)a.forEach(function(k){res[k]="2x no dia"})})});
  return res;
}

/* linhas do mês. modo: {editMes, editDia, conf, preview, podeBtn} */

  var ocultar=!modo.preview&&!modo.editMes&&mesAtual&&nPassados>0&&!ui.verAnteriores&&!(modo.editDia&&modo.editDia<hj)&&!(ui.alvo&&ui.alvo<hj);

  }
  if(ocultar) ordem=ordem.filter(function(d){return d>=hj});
  var semAtual=null;
  ordem.forEach(function(d){

function evsEntre(de,ate){return eventos().filter(function(e){return e.d>=de&&e.d<=ate})}
function segundaDe(d){var dt=parse(d);dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return ymd(dt)}
function maisDias(d,n){var dt=parse(d);dt.setDate(dt.getDate()+n);return ymd(dt)}
function linhaSvc(s){var t=TIPOS[s.t];var pre=s.t==="rjm"?"RJM "+hora(t.hora):s.t==="dom"?"Noite "+hora(t.hora):hora(t.hora);return pre+" · "+t.roles.map(function(r){return ROLE[r]+": "+nome(s[r])}).join(" | ")}
function textoLista(titulo,evs){
  var L=[titulo,""], ult=null;
  evs.forEach(function(e){var dt=parse(e.d);
    if(e.d!==ult){if(ult)L.push("");L.push("*"+fmtCurta(e.d)+" "+SEM3[dt.getDay()]+"*");ult=e.d}
    if(e.k==="ens") L.push("Ensaio "+hora(e.h)+" · Afinação: "+nome(e.e.afina));
    else L.push(linhaSvc(e.s));
  });
  if(!evs.length) L.push("Nenhum culto na escala.");
  return L.join("\n").trim();
}
function textoMes(ym){return textoLista("*RODÍZIO DE ORGANISTAS · "+mesNome(ym).toUpperCase()+"*",evsEntre(ym+"-01",ym+"-31"))}
function textoSemana(d){var de=segundaDe(d),ate=maisDias(de,6);return textoLista("*RODÍZIO DE ORGANISTAS · SEMANA DE "+fmtCurta(de)+" A "+fmtCurta(ate)+"*",evsEntre(de,ate))}
function textoDia(d){
  var L=["*RODÍZIO DE ORGANISTAS*","*"+dataLonga(d)+"*"];
  evsEntre(d,d).forEach(function(e){
    L.push("");
    if(e.k==="ens"){L.push("_Ensaio · "+hora(e.h)+"_");L.push("Afinação: "+nome(e.e.afina));return}
    var t=TIPOS[e.s.t];L.push("_"+t.nome+" · "+hora(t.hora)+"_");
    t.roles.forEach(function(r){L.push(ROLE[r]+": "+nome(e.s[r]))});
  });
  return L.join("\n");
}
function copiar(txt,oque){

function iniciarDados(){
  var cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.projectId||/COLE_AQUI/.test(cfg.projectId)){ui.modo="local";try{var l=localStorage.getItem("rodizio-local");if(l){SRC=normalizarDados(JSON.parse(l));S=clone(SRC)}}catch(e){}
    try{ui.acessos=JSON.parse(localStorage.getItem("rodizio-acessos-local")||"{}")}catch(e){ui.acessos={}}
    validarAcesso();render();return}
  try{firebase.initializeApp(cfg);docRef=firebase.firestore().collection("rodizio").doc("escala");accRef=firebase.firestore().collection("rodizio").doc("acessos");}catch(e){ui.modo="local";ui.acessos={};render();return}
  ui.modo="online";
  docRef.onSnapshot(function(snap){
    if(!snap.exists){ui.semDados=true;semear();render();return}
    ui.semDados=false;
    var d=snap.data();if(!d||!d.json)return;
    try{SRC=normalizarDados(JSON.parse(d.json))}catch(e){return}
    if(!ui.dirty&&!ui.editDia&&!ui.rasc&&!ui.saving)S=clone(SRC);
    render();
  },function(){toast("Sem conexão com o banco. Mostrando a última escala carregada.")});
  accRef.onSnapshot(function(snap){
    var d=snap.exists?snap.data():null; ui.acessos=(d&&d.nomes)||{};
    validarAcesso(); semear(); render();
  },function(){if(ui.acessos===null){ui.acessos={};render()}});
}
function validarAcesso(){
  if(!ui.eu) return;
  var a=ui.acessos&&ui.acessos[ui.eu];
  if(!a||a.dev!==ui.dev){
    ui.eu=null;ui.edit=false;ui.editDia=null;ui.dirty=false;S=clone(SRC);
    try{localStorage.removeItem("rodizio-eu")}catch(e){}
    toast("Seu acesso foi liberado. Escolha seu nome de novo.");
  }
}
function guardarAcessosLocal(){try{localStorage.setItem("rodizio-acessos-local",JSON.stringify(ui.acessos))}catch(e){}}
function reservarNome(id){
  var reg={dev:ui.dev,em:new Date().toISOString()};
  if(ui.modo!=="online"){if(ui.acessos[id])return Promise.reject("ocupado");ui.acessos[id]=reg;guardarAcessosLocal();return Promise.resolve()}
  var db=firebase.firestore();
  return db.runTransaction(function(tx){return tx.get(accRef).then(function(snap){
    var nomes=(snap.exists&&snap.data().nomes)||{};
    if(nomes[id]) throw "ocupado";
    nomes[id]=reg; tx.set(accRef,{nomes:nomes});
  })}).then(function(){ui.acessos[id]=reg});
}
function liberarNome(id){
  if(ui.modo!=="online"){delete ui.acessos[id];guardarAcessosLocal();return Promise.resolve()}
  var upd={};upd["nomes."+id]=firebase.firestore.FieldValue.delete();
  return accRef.update(upd);
}
function semear(){if(docRef&&ui.semDados&&podeEditar()){ui.semDados=false;docRef.set({json:JSON.stringify(SRC),atualizado:firebase.firestore.FieldValue.serverTimestamp(),por:nome(ui.eu)}).catch(function(){ui.semDados=true})}}
function fimSalvar(){ui.saving=false;ui.dirty=false;ui.editDia=null;ui.bkp=null;SRC=clone(S);toast("Escala salva para todas.");render()}
function salvar(){
  if(ui.saving||!podeEditar()) return;
  ui.saving=true;render();
  if(ui.modo!=="online"){try{localStorage.setItem("rodizio-local",JSON.stringify(S))}catch(e){}fimSalvar();toast("Salvo só neste aparelho (banco não configurado).");return}
  docRef.set({json:JSON.stringify(S),atualizado:firebase.firestore.FieldValue.serverTimestamp(),por:nome(ui.eu)}).then(fimSalvar,function(){
    ui.saving=false;toast("Não foi possível salvar. Confira a internet e tente de novo.");render();
  });
}

/* ---------- eventos de UI ---------- */
app.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-tab],[data-act]"); if(!b) return;
  if(b.dataset.tab){ui.view=b.dataset.tab;ui.confirm=null;
    if(ui.view==="mes"&&!ui.editDia&&!ui.edit){ui.alvo=null;ui.verAnteriores=false;var nx=proximoDia();if(nx)ui.ym=nx.slice(0,7)}
    render();window.scrollTo(0,0);if(ui.view==="mes")focarProximo(false);return}
  var a=b.dataset.act, id=b.dataset.org, o=id&&orgById(id);
  if(a==="escolher"){ui.pedido=id;render();window.scrollTo(0,0);return}
  if(a==="voltar-nomes"){ui.pedido=null;render();return}
  if(a==="confirmar-nome"&&ui.pedido&&!ui.saving){var pid=ui.pedido;ui.saving=true;render();
    reservarNome(pid).then(function(){ui.saving=false;ui.pedido=null;ui.eu=pid;try{localStorage.setItem("rodizio-eu",pid)}catch(e){}ui.view="proximo";render();window.scrollTo(0,0);semear();toast(pid===EDITORA?"Olá, "+nome(pid)+". Você pode editar a escala.":"Olá, "+nome(pid)+"!")},
    function(err){ui.saving=false;ui.pedido=null;render();toast(err==="ocupado"?"Esse nome já foi escolhido em outro celular.":"Sem conexão. Tente de novo.")});return}
  if(a==="liberar"&&id){ui.confirm="lib-"+id;render();return}
  if(a==="liberar-sim"&&id){ui.confirm=null;liberarNome(id).then(function(){toast(nome(id)+" liberada. Ela pode escolher o nome de novo.");render()},function(){toast("Não foi possível liberar agora.")});return}
  if(a==="org-abrir"){ui.orgAberta=ui.orgAberta===id?null:id;ui.confirm=null;render();return}
  if(a==="ver-anteriores"){ui.verAnteriores=true;render();return}
  if(a==="ocultar-anteriores"){ui.verAnteriores=false;render();return}
  if(a==="limpar-alvo"){ui.alvo=null;render()}
  else if(a==="mes-prev"){ui.ym=addMonth(ui.ym,-1);render()}
  else if(a==="mes-next"){ui.ym=addMonth(ui.ym,1);render()}
  else if(a==="toggle-edit"){ui.edit=!ui.edit;render()}
  else if(a==="gerar"){ui.gerMes=ui.ym;ui.rasc={ym:ui.ym,v:0,data:gerar(ui.ym,0)};ui.view="gerenciar";render();irPara("gerar-h")}
  else if(a==="gerar-ger"){var gm=ui.gerMes||addMonth(ymOf(new Date()),1);ui.rasc={ym:gm,v:0,data:gerar(gm,0)};render()}
  else if(a==="rasc-outra"&&ui.rasc){ui.rasc.v++;ui.rasc.data=gerar(ui.rasc.ym,ui.rasc.v);render();toast("Nova opção gerada.")}
  else if(a==="rasc-cancelar"){ui.rasc=null;render();irPara("gerar-h");toast("Geração cancelada. Nada foi alterado.")}
  else if(a==="rasc-salvar"&&ui.rasc){S.meses[ui.rasc.ym]=ui.rasc.data;ui.ym=ui.rasc.ym;ui.rasc=null;ui.view="mes";ui.dirty=true;salvar()}
  else if(a==="editar-dia"){ui.bkp={ym:ui.ym,m:JSON.stringify(S.meses[ui.ym]),dirty:ui.dirty};ui.editDia=b.dataset.d;ui.edit=false;render();irPara("dia-"+ui.editDia)}
  else if(a==="dia-cancelar"&&ui.bkp){S.meses[ui.bkp.ym]=JSON.parse(ui.bkp.m);ui.dirty=ui.bkp.dirty;var dc=ui.editDia;ui.editDia=null;ui.bkp=null;render();irPara("dia-"+dc)}
  else if(a==="dia-salvar"){ui.dirty=true;salvar()}
  else if(a==="descartar"){S=JSON.parse(JSON.stringify(SRC));ui.dirty=false;ui.edit=false;ui.editDia=null;ui.bkp=null;render();toast("Alterações descartadas.")}
  else if(a==="editar-evento"){var d0=b.dataset.d;ui.view="mes";ui.ym=d0.slice(0,7);ui.bkp={ym:ui.ym,m:JSON.stringify(S.meses[ui.ym]),dirty:ui.dirty};ui.editDia=d0;ui.edit=false;render();irPara("dia-"+d0)}
  else if(a==="mes-excluir"){ui.confirm="exc-"+b.dataset.ym;render()}
  else if(a==="mes-excluir-sim"){var ky=b.dataset.ym;delete S.meses[ky];ui.confirm=null;ui.dirty=true;salvar();toast("Escala de "+mesNome(ky)+" excluída.")}
  else if(a==="min-rm"){ui.confirm="minrm-"+id;render()}
  else if(a==="min-rm-sim"){S.ministerio=S.ministerio.filter(function(x){return x.id!==id});ui.confirm=null;mudou()}
  else if(a==="add-min"){var im=document.getElementById("novo-min"),nm=im.value.trim();if(!nm)return;var mid=slug(nm),mb=mid,mc=2;while(pessoaById(mid))mid=mb+(mc++);S.ministerio.push({id:mid,nome:nm});mudou()}
  else if(a==="cancelar"){ui.confirm=null;render()}
  else if(a==="copiar"){copiar(textoMes(ui.ym),"Escala do mês")}
  else if(a==="copiar-semana"){copiar(textoSemana(b.dataset.d),"Escala da semana")}
  else if(a==="copiar-dia"){copiar(textoDia(b.dataset.d),"Escala do dia")}
  else if(a==="dia"&&o){var d=b.dataset.dia,i=o.dias.indexOf(d);if(i>=0)o.dias.splice(i,1);else o.dias.push(d);mudou()}
  else if(a==="afina-t"&&o){o.afina=!o.afina;mudou()}
  else if(a==="ativa"&&o){o.ativa=!o.ativa;mudou()}
  else if((a==="up"||a==="down")&&o){var L=S.organistas,k=L.indexOf(o),j=a==="up"?k-1:k+1;if(j>=0&&j<L.length){L[k]=L[j];L[j]=o;mudou()}}
  else if(a==="rm"&&o){ui.confirm="rm-"+id;render()}
  else if(a==="rm-sim"&&o){S.organistas.splice(S.organistas.indexOf(o),1);ui.confirm=null;mudou()}
  else if(a==="add-org"){var inp=document.getElementById("nova-org"),n=inp.value.trim();if(!n)return;var sid=slug(n),base=sid,c=2;while(pessoaById(sid))sid=base+(c++);S.organistas.push({id:sid,nome:n,dias:["qua","sab","dom"],afina:true,ativa:true});mudou()}
  else if(a==="add-fol"){var fo=document.getElementById("fol-org").value,de=document.getElementById("fol-de").value,ate=document.getElementById("fol-ate").value||de;if(!fo||!de){toast("Escolha a organista e a data inicial.");return}if(ate<de){var tmp=de;de=ate;ate=tmp}S.folgas.push({id:"f"+Date.now().toString(36),org:fo,de:de,ate:ate});mudou()}
  else if(a==="rm-fol"){S.folgas=S.folgas.filter(function(f){return f.id!==b.dataset.fol});mudou()}
  else if(a==="regra"){S.regraMesmoDia=!S.regraMesmoDia;mudou()}
  else if(a==="salvar"){salvar()}
});
app.addEventListener("change",function(ev){
  var el=ev.target;
  if(el.id==="eu-sel"){ui.eu=el.value||null;try{if(ui.eu)localStorage.setItem("rodizio-eu",ui.eu);else localStorage.removeItem("rodizio-eu")}catch(e){}render();return}
  if(el.id==="ir-data"){ui.alvo=el.value||null;if(ui.alvo){ui.ym=ui.alvo.slice(0,7);ui.edit=false}render();if(ui.alvo){if(document.getElementById("dia-"+ui.alvo))irPara("dia-"+ui.alvo)}return}
  if(el.id==="xls"&&el.files&&el.files[0]){lerPlanilha(el.files[0]);return}
  if(el.id==="ger-mes"){ui.gerMes=el.value;ui.confirm=null;render();return}
  if(el.dataset.i!=null&&el.dataset.r){var s=S.meses[ui.ym].servicos[+el.dataset.i];s[el.dataset.r]=el.value;mudou();return}
  if(el.id==="sel-afina"){S.meses[ui.ym].ensaio.afina=el.value;mudou();return}
  if(el.id==="ens-data"){if(el.value){S.meses[ui.ym].ensaio.d=el.value;mudou()}return}
  if(el.classList.contains("nmI")){var o=orgById(el.dataset.org),v=el.value.trim();if(o&&v&&v!==o.nome){o.nome=v;mudou()}}
});

render();
if(ui.view==="mes")focarProximo(false);
iniciarDados();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}
})();
</script>
</body>
